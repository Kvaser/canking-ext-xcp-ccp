[package]
name = "protocol-core"
version = "1.0.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
serde = ["dep:serde"]

[lib]
crate-type = ["rlib"]

[[example]]
name = "dump_default_config"
required-features = ["serde"]