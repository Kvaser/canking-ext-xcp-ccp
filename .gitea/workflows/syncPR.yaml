name: Sync GitHub PRs

on:
  workflow_dispatch: {}

env:
  GITEA_SERVER: http://git.kvaser.se
  GITEA_SSH_HOST: git.kvaser.se
  GITEA_OWNER: kvaser
  GITEA_REPO: canking-ext-xcp-ccp
  GITHUB_OWNER: Kvaser
  GITHUB_REPO: canking-ext-xcp-ccp
  BASE_BRANCH: develop

jobs:
  sync-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH auth
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PR_SYNC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${GITEA_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Checkout
        run: |
          git init -q .
          git remote add origin "git@${GITEA_SSH_HOST}:${GITEA_OWNER}/${GITEA_REPO}.git"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q -B "${BASE_BRANCH}" "origin/${BASE_BRANCH}"

      - name: Fetch PR refs from GitHub
        run: |
          auth=$(printf 'x-access-token:%s' "${{ secrets.GH_API_TOKEN }}" | base64 -w0)
          git remote add github "https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git"
          git -c http.extraheader="Authorization: Basic ${auth}" \
            fetch github '+refs/pull/*/head:refs/remotes/github/pr/*' --prune

      - name: Sync PRs into Gitea
        env:
          GITEA_TOKEN: ${{ secrets.PR_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: python3 .gitea/scripts/sync_github_prs.py
