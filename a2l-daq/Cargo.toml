[package]
name = "a2l-daq"
version = "1.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
protocol-core = { path = "../protocol-core" }
wit-bindgen = { version = "0.58.0", optional = true }
serde_json = { version = "1", optional = true }

[features]
component = ["dep:wit-bindgen", "protocol-core/serde", "dep:serde_json"]

[[bin]]
name = "a2l-daq-cli"
path = "src/main.rs"
