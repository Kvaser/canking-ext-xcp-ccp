[package]
name = "a2l-daq"
version = "1.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
protocol-core = { path = "../protocol-core" }
wit-bindgen = { version = "0.58.0", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = ["tscript"]
tscript = []
serde = ["protocol-core/serde"]
component = ["dep:wit-bindgen", "serde", "dep:serde_json", "tscript"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "a2l-daq-cli"
path = "src/main.rs"
required-features = ["tscript"]
